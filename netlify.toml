# Netlify (free plan) builds the Shanker Medicos website from its own folder.
# Next.js is detected automatically. The site runs in publish-only mode
# (no database) unless Supabase keys are added.
[build]
  base = "shanker-medicos"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
