# Netlify (free plan) builds the Shanker Medicos website from its own folder.
# Next.js is detected automatically. The site runs in publish-only mode
# (no database) unless Supabase keys are added.
[build]
  base = "shanker-medicos"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Netlify's Next.js runtime: turns the Next.js build into a working website.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# The home address "/" has no page of its own: send visitors to their language.
# (The site's proxy does this too; these rules make sure it works on Netlify.)
[[redirects]]
  from = "/"
  to = "/pa"
  status = 302
  conditions = { Language = ["pa"] }

[[redirects]]
  from = "/"
  to = "/hi"
  status = 302
  conditions = { Language = ["hi"] }

[[redirects]]
  from = "/"
  to = "/en"
  status = 302
