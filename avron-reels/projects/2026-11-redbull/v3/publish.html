<title>The Can</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{ --bg:#0A0A0C; --fg:#FFFFFF; --muted:#9A9AA6; --card:#141418; --accent:#FACC15; color-scheme:dark }
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ --bg:#F4F4F6; --fg:#0A0A0C; --muted:#5C5C68; --card:#FFFFFF; color-scheme:light } }
:root[data-theme="light"]{ --bg:#F4F4F6; --fg:#0A0A0C; --muted:#5C5C68; --card:#FFFFFF; color-scheme:light }
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:12px;padding-block:16px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
header{width:100%;max-width:980px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;align-items:baseline}
header h1{font-size:18px;font-weight:800} header p{font-size:13px;color:var(--muted)}
.wrap{width:100%;max-width:980px;display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
#vp{position:relative;width:min(100%, calc((100vh - 190px) * .5625), 460px);aspect-ratio:9/16;max-width:100%;background:#0A0A0C;border-radius:10px;overflow:hidden}
#vp canvas{width:100%!important;height:100%!important;display:block}
.controls{flex:1 1 280px;max-width:460px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center}
button{font:600 13px Inter,sans-serif;border:1px solid var(--muted);background:var(--card);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=range]{flex:1;accent-color:#FACC15}
#tc{font:600 13px 'JetBrains Mono',monospace;min-width:84px}
.list{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.list button{text-align:left;font-weight:500}.list b{display:block;font:500 11px 'JetBrains Mono',monospace;color:var(--muted)}
.note{font-size:12px;color:var(--muted);line-height:1.5}
html.render body{padding:0;background:#0A0A0C} html.render header, html.render .controls{display:none}
html.render #vp{position:fixed;left:0;top:0;width:1080px;height:1920px;max-width:none;border-radius:0}
</style>
<script>
  // one source for three.js: local copy when rendering, pinned CDN when viewed as a page
  window.RENDER = /[?&]render=1/.test(location.search);
  if (RENDER) document.documentElement.classList.add('render');
  const base = RENDER ? './vendor/' : 'https://cdn.jsdelivr.net/npm/three@0.170.0/';
  const map = RENDER ? { three: './vendor/three.module.js', 'three/addons/': './vendor/addons/' }
                     : { three: base + 'build/three.module.js', 'three/addons/': base + 'examples/jsm/environments/' };
  document.write('<script type="importmap">' + JSON.stringify({ imports: map }) + '<\/script>');
</script>
<header><h1>The Can · Red Bull Media Flywheel v3</h1><p>3:00 · real-time 3D · everything comes out of the can</p></header>
<div class="wrap">
  <div id="vp"></div>
  <div class="controls">
    <div class="row"><button id="play">Play</button><input id="scrub" type="range" min="0" max="180" step="0.0333" value="0" aria-label="Timeline"><span id="tc">0:00.0</span></div>
    <div class="list" id="list"></div>
    <p class="note">Silent picture lock. The preview runs at your device's frame rate; the MP4 is rendered frame by frame from the same file.</p>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/RoomEnvironment.js';

const W = 1080, H = 1920, DUR = 180;
const YEL = 0xFFC906, CRIM = 0xE8174A, MATTE = 0x0A0A0C, NAVY = 0x0B1253;

/* ------------------------------------------------ maths */
function bez(x1,y1,x2,y2){const cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx,cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;const sx=t=>((ax*t+bx)*t+cx)*t,sy=t=>((ay*t+by)*t+cy)*t,dx=t=>(3*ax*t+2*bx)*t+cx;return x=>{if(x<=0)return 0;if(x>=1)return 1;let t=x;for(let i=0;i<8;i++){const e=sx(t)-x,d=dx(t);if(Math.abs(e)<1e-5||!d)break;t-=e/d}return sy(Math.min(1,Math.max(0,t)))}}
const SNAP=bez(.7,0,.2,1), OUT=bez(.16,1,.3,1), INOUT=bez(.45,0,.2,1), IN=bez(.6,0,1,.6);
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const p=(t,a,b,e=SNAP)=>e(cl((t-a)/(b-a)));
const mix=(a,b,x)=>a+(b-a)*x;
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const v3=(x,y,z)=>new THREE.Vector3(x,y,z);

/* ------------------------------------------------ renderer + post */
const renderer = new THREE.WebGLRenderer({ antialias:false, preserveDrawingBuffer:true, powerPreference:'high-performance' });
renderer.setPixelRatio(1); renderer.setSize(W,H,false);
document.getElementById('vp').appendChild(renderer.domElement);
const rt = new THREE.WebGLRenderTarget(W,H,{ samples:4, type:THREE.HalfFloatType });
const scene = new THREE.Scene();
const BGT = (() => { const c=document.createElement('canvas'); c.width=1080; c.height=1920; const g=c.getContext('2d');
  const gr=g.createRadialGradient(540,820,80,540,900,1300); gr.addColorStop(0,'#1a2aa0'); gr.addColorStop(.55,'#0d166a'); gr.addColorStop(1,'#060a3a'); g.fillStyle=gr; g.fillRect(0,0,1080,1920);
  // halftone: dot size grows toward the top-left and bottom-right corners
  for(let y=0;y<1920;y+=22) for(let x=0;x<1080;x+=22){ const a=Math.max(0,1-Math.hypot(x/1080, y/1920)/0.55), b=Math.max(0,1-Math.hypot(1-x/1080,1-y/1920)/0.6); const rr=7*Math.max(a,b); if(rr>.4){ g.fillStyle='rgba(60,80,200,.35)'; g.beginPath(); g.arc(x+(y/22%2)*11,y,rr,0,7); g.fill(); } }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t; })();
const SPACE = new THREE.Color(0x05060f);
scene.background = BGT;
scene.fog = new THREE.FogExp2(NAVY, 0.012);
const pm = new THREE.PMREMGenerator(renderer);
const studio = (() => { const sc=new THREE.Scene(); sc.background=new THREE.Color(0x2a2d3a);
  const box=(w,h,x,y,z,ry,i,col=0xffffff)=>{ const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshBasicMaterial({ color:new THREE.Color(col).multiplyScalar(i), side:THREE.DoubleSide })); m.position.set(x,y,z); m.lookAt(0,y*.3,0); sc.add(m); };
  box(1.2,14,-7,2,3,0,6);           // left strip: the long vertical highlight
  box(0.6,14, 6.5,2,1.5,0,4);       // right rim strip
  box(10,2.2,0,9,0,0,.9);           // top softbox
  box(14,6,0,1,-9,0,.35,0x3a4ccc);  // navy bounce from the set
  box(3,3,3,-4,6,0,.6,0xffc906);    // warm kicker, low front-right
  return sc; })();
scene.environment = pm.fromScene(studio, 0.02).texture;
scene.environmentIntensity = 1.0;
const camera = new THREE.PerspectiveCamera(32, W/H, 0.05, 2000);

const post = new THREE.ShaderMaterial({
  uniforms:{ tex:{value:rt.texture}, uT:{value:0}, uFlash:{value:0}, uMode:{value:0}, uCA:{value:1}, uRes:{value:new THREE.Vector2(W,H)}, uWhip:{value:0}, uWDir:{value:1} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
  fragmentShader:`
    precision highp float; varying vec2 vUv; uniform sampler2D tex; uniform float uT,uFlash,uMode,uCA,uWhip,uWDir; uniform vec2 uRes;
    float h(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
    vec3 tm(vec3 c){ vec3 k=step(vec3(.8),c); return mix(c, .8+.2*(1.-exp(-(c-.8)/.2)), k); }
    vec3 srgb(vec3 c){ c=max(c,0.); return mix(c*12.92, 1.055*pow(c,vec3(1./2.4))-.055, step(vec3(.0031308),c)); }
    void main(){
      vec2 uv=vUv, c=uv-.5; c.x*=uRes.x/uRes.y; float r2=dot(c,c);
      vec2 d = (uv-.5)*(1.+.035*r2)/(1.+.035*.42) + .5;                    // barrel
      vec2 ca = (uv-.5)*r2*.006*uCA;                           // chromatic aberration grows to the edges
      vec3 col = vec3(texture2D(tex,d+ca).r, texture2D(tex,d).g, texture2D(tex,d-ca).b);
      if (uWhip > .001) { vec3 acc=vec3(0.); for(int i=0;i<28;i++){ float o=(float(i)/27.-.5)*uWhip*.16; acc+=texture2D(tex, d+vec2(o*uWDir, o*(1.-abs(uWDir)))).rgb; } col=mix(col, acc/28., clamp(uWhip*3.,0.,1.)); }
      // halation: ring taps of the bright part, warm tint
      vec3 glow=vec3(0.); for(int i=0;i<12;i++){ float a=float(i)*.5236; vec2 o=vec2(cos(a),sin(a));
        glow += max(texture2D(tex,d+o*vec2(7.,7.)/uRes).rgb-1.1,0.) + max(texture2D(tex,d+o*vec2(22.,22.)/uRes).rgb-1.1,0.)*.7; }
      col += glow/12.*vec3(1.,.62,.38)*.9;
      // anamorphic streak: horizontal taps of very bright pixels
      vec3 st=vec3(0.); for(int i=-8;i<=8;i++){ st += max(texture2D(tex,d+vec2(float(i)*14./uRes.x,0.)).rgb-1.4,0.); }
      col += st/17.*vec3(.75,.85,1.)*.8;
      col = srgb(tm(col));
      float g = h(uv*uRes + fract(uT*7.13)*100.) - .5; col += g*.035;               // 35mm grain
            float vig = smoothstep(1.05,.35,length((uv-.5)*vec2(1.,.82))); col *= mix(.7,1.,vig);
            vec3 flash = uMode<.5 ? 1.-col : (uMode<1.5 ? vec3(step(.42,dot(col,vec3(.3,.59,.11))))*vec3(1.,.86,.25) : vec3(col.r*1.4,col.g*.15,col.b*.15));
      col = mix(col, flash*.85, uFlash);
      gl_FragColor=vec4(col,1.);
    }`
});
const postScene = new THREE.Scene(); const postCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), post));

/* ------------------------------------------------ lights */
const key = new THREE.SpotLight(0xfff1dc, 120, 60, .55, .6, 1.6); key.position.set(-6,12,8); scene.add(key, key.target);
const rimY = new THREE.PointLight(YEL, 0, 30, 1.8); scene.add(rimY);
const rimR = new THREE.PointLight(CRIM, 0, 30, 1.8); scene.add(rimR);
scene.add(new THREE.HemisphereLight(0x8899aa, 0x080808, .25));

/* ------------------------------------------------ text: canvas planes with a wipe-reveal shader */
const FONT = "Inter, 'Inter Display', system-ui, sans-serif", MONO = "'JetBrains Mono','DejaVu Sans Mono',monospace";
function textMesh(lines, { w = 4, align = 'left', pad = 0.06 } = {}) {
  // lines: [{t, size, weight, color, font, track}]
  const S = 512 / w; const cv = document.createElement('canvas'); const g = cv.getContext('2d');
  const hs = lines.map(l => (l.size||.5) * 1.02);
  const totalH = hs.reduce((a,b)=>a+b,0) + pad*2; cv.width = 1024; cv.height = Math.ceil(totalH * S * 2);
  const k = cv.width / w; let y = pad * k; const widths=[];
  const draw = () => { g.clearRect(0,0,cv.width,cv.height); y = pad*k;
    lines.forEach((l,i) => { const fs = (l.size||.5)*k; g.font = `${l.weight||900} ${fs}px ${l.font||FONT}`; g.fillStyle = l.color||'#fff';
      g.textBaseline = 'top'; if ('letterSpacing' in g) g.letterSpacing = (l.track ?? (l.font===MONO? .12 : -.045))*fs + 'px';
      const tw = g.measureText(l.t).width; const x = align==='center' ? (cv.width-tw)/2 : align==='right' ? cv.width-tw-pad*k : pad*k;
      g.fillText(l.t, x, y + fs*.06); widths[i]=tw/k; y += hs[i]*k; }); };
  draw();
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const mat = new THREE.ShaderMaterial({ transparent:true, depthWrite:false, side:THREE.DoubleSide,
    uniforms:{ map:{value:tex}, uR:{value:1}, uO:{value:1}, uE:{value:1.0} },
    vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader:`varying vec2 vUv; uniform sampler2D map; uniform float uR,uO,uE;
      void main(){ vec4 c=texture2D(map,vUv); float edge = uR*1.15 - vUv.x*0.15 - (1.-vUv.y)*0.0; float m = smoothstep(vUv.x-.02, vUv.x+.02, uR*1.1-.05);
        float hot = smoothstep(.06,0.,abs(vUv.x-(uR*1.1-.05)))*step(.01,uR)*step(uR,.99);
        gl_FragColor = vec4(c.rgb*uE + vec3(1.,.85,.3)*hot*c.a*2., c.a*m*uO); }` });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, w*cv.height/cv.width), mat);
  mesh.userData = { widths, w, pad, set:(r,o=1)=>{ mat.uniforms.uR.value=r; mat.uniforms.uO.value=o; mesh.visible = o>0.001 && r>0.001; }, redraw:(arr)=>{ arr.forEach((t,i)=>lines[i].t=t); draw(); tex.needsUpdate=true; } };
  return mesh;
}
const L = (t, size=.5, color='#fff', weight=900, font=FONT, track) => ({ t, size, color, weight, font, track });
const M = (t, size=.16, color='#9A9AA6') => L(t, size, color, 600, MONO, .12);

/* ------------------------------------------------ the can */
const BULL = new Image(); BULL.src = 'img/bull_logo.png';
function labelTexture(){
  const W2=2048,H2=1024; const cv=document.createElement('canvas'); cv.width=W2; cv.height=H2; const g=cv.getContext('2d');
  // silver half with brushed sheen
  let gr=g.createLinearGradient(0,0,0,H2); gr.addColorStop(0,'#e8eaf0'); gr.addColorStop(.5,'#c9ccd6'); gr.addColorStop(1,'#aeb2bf'); g.fillStyle=gr; g.fillRect(0,0,W2,H2);
  // blue half: the left half of the wrap, diagonal checker border like the real can
  const blue='#1d2a6e', cs=46;
  const edge = (y) => 1024 + 300 - y*0.62;       // diagonal boundary x(y) on the front
  for(let y=0;y<H2;y+=cs) for(let x=0;x<W2;x+=cs){ const e=edge(y), cx=x+cs/2;
    const inBlue = (cx < e - 70) || (cx > e + 1024 - 70 && false);
    const inBand = Math.abs(cx - e) < 70 && ((x/cs + y/cs) % 2 === 0);
    if (inBlue || inBand) { g.fillStyle=blue; g.fillRect(x,y,cs+.5,cs+.5); } }
  // the back of the can: mirror (blue right side) so the wrap reads continuous
  g.save(); g.globalCompositeOperation='source-over';
  for(let y=0;y<H2;y+=cs) for(let x=0;x<W2;x+=cs){ const e=edge(y)-1024, cx=x+cs/2; if (cx < e-70 && x<1024-500) { g.fillStyle=blue; g.fillRect(x,y,cs+.5,cs+.5); } }
  g.restore();
  // logo on the front (u=.5 after offset), above the wordmark
  if (BULL.complete && BULL.naturalWidth) { const lw=560, lh=lw*BULL.naturalHeight/BULL.naturalWidth; g.drawImage(BULL, 1024-lw/2, 250, lw, lh); }
  g.font=`900 190px ${FONT}`; g.textAlign='center'; g.textBaseline='middle'; if('letterSpacing' in g) g.letterSpacing='-6px';
  g.fillStyle='#d4123f'; g.fillText('Red Bull',1024,690);
  g.font=`800 52px ${FONT}`; if('letterSpacing' in g) g.letterSpacing='18px'; g.fillStyle=blue; g.fillText('ENERGY DRINK',1024,830);
  // faint vertical brushed streaks
  g.globalAlpha=.05; for(let i=0;i<500;i++){ g.fillStyle=i%2?'#fff':'#000'; g.fillRect(Math.random()*W2,0,1,H2); } g.globalAlpha=1;
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; t.wrapS=THREE.RepeatWrapping; t.offset.x=.5; t.anisotropy=8; return t;
}
const LABEL = labelTexture();
const BEADS = (() => { const c=document.createElement('canvas'); c.width=1024; c.height=1024; const g=c.getContext('2d'); g.fillStyle='#000'; g.fillRect(0,0,1024,1024);
  for(let i=0;i<5200;i++){ const x=hash(i*1.1)*1024, y=hash(i*2.7)*1024, rr=.8+Math.pow(hash(i*3.3),3)*5.5; const gr=g.createRadialGradient(x-rr*.3,y-rr*.3,0,x,y,rr); gr.addColorStop(0,'#fff'); gr.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=gr; g.beginPath(); g.ellipse(x,y,rr*.85,rr,0,0,7); g.fill(); }
  // a few running drips
  for(let i=0;i<26;i++){ const x=hash(i*7.7)*1024, y0=hash(i*4.4)*700, L=60+hash(i*9.9)*260; g.strokeStyle='rgba(255,255,255,.7)'; g.lineWidth=2+hash(i)*2; g.beginPath(); g.moveTo(x,y0); g.lineTo(x+Math.sin(i)*6,y0+L); g.stroke(); }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(2,1); return t; })();
const alu = new THREE.MeshStandardMaterial({ color:0xbfc3cc, metalness:1, roughness:.22 });
const crushU = { value:0 };
function makeCan(){
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshPhysicalMaterial({ map:LABEL, bumpMap:BEADS, bumpScale:1.6, metalness:.32, roughness:.3, clearcoat:1, clearcoatRoughness:.08, transparent:true, opacity:1 });
  bodyMat.onBeforeCompile = sh => { sh.uniforms.uCrush = crushU;
    sh.vertexShader = 'uniform float uCrush;\n' + sh.vertexShader.replace('#include <begin_vertex>',
      `#include <begin_vertex>
       float yy = position.y; transformed.xz *= 1. + uCrush*.28*sin(yy*7.5);
       transformed.y = mix(yy, yy*.16, uCrush);`); };
  const body = new THREE.Mesh(new THREE.CylinderGeometry(1,1,4.3,128,24,true), bodyMat); body.position.y = 2.4; g.add(body);
  const bottom = new THREE.Mesh(new THREE.LatheGeometry([v3(0,.05,0),v3(.7,0,0),v3(.9,.03,0),v3(.98,.12,0),v3(1,.25,0)].map(v=>new THREE.Vector2(v.x,v.y)),96), alu); g.add(bottom);
  const shoulder = new THREE.Mesh(new THREE.LatheGeometry([[1,4.55],[.98,4.68],[.92,4.82],[.87,4.93],[.86,4.99]].map(a=>new THREE.Vector2(a[0],a[1])),96), alu); g.add(shoulder);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(.87,.04,16,96), alu); rim.rotation.x=Math.PI/2; rim.position.y=5.0; g.add(rim);
  const lid = new THREE.Mesh(new THREE.CircleGeometry(.85,96), new THREE.MeshStandardMaterial({ color:0xc4c8d2, metalness:.85, roughness:.4 })); lid.rotation.x=-Math.PI/2; lid.position.y=4.95; g.add(lid);
  const hole = new THREE.Mesh(new THREE.CircleGeometry(.24,48), new THREE.MeshBasicMaterial({ color:0x020203 })); hole.rotation.x=-Math.PI/2; hole.scale.set(1,0.001,1); hole.position.set(0,4.955,.42); g.add(hole);
  // ring pull: pivot near lid centre, tab lies toward +z (front)
  const ringPivot = new THREE.Group(); ringPivot.position.set(0,4.97,.05); g.add(ringPivot);
  const tabShape = new THREE.Shape(); tabShape.absellipse(0,0,.2,.34,0,Math.PI*2); const holeP = new THREE.Path(); holeP.absellipse(0,-.08,.11,.16,0,Math.PI*2); tabShape.holes.push(holeP);
  const tab = new THREE.Mesh(new THREE.ExtrudeGeometry(tabShape,{ depth:.025, bevelEnabled:true, bevelSize:.01, bevelThickness:.01, curveSegments:32 }), alu);
  tab.rotation.x = -Math.PI/2; tab.position.set(0,0,-.18); ringPivot.add(tab);
  const rivet = new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,.04,24), alu); rivet.position.y = .01; ringPivot.add(rivet);
  g.userData = { body, bodyMat, hole, ringPivot };
  return g;
}
const can = makeCan(); scene.add(can);
const setPop = (c, x) => { c.userData.ringPivot.rotation.x = -x*1.25; c.userData.hole.scale.set(1, cl(x*3), 1); };

/* ------------------------------------------------ gas / mist bursts (deterministic, GPU) */
const sprite = (() => { const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d'); const r=g.createRadialGradient(64,64,0,64,64,64); r.addColorStop(0,'rgba(255,255,255,1)'); r.addColorStop(.4,'rgba(255,255,255,.35)'); r.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=r; g.fillRect(0,0,128,128); const t=new THREE.CanvasTexture(c); return t; })();
function burst({ n=1800, life=3.2, spread=.5, speed=7, up=1.6, size=.55, tint=[1,1,1], dur=.5, alpha=1, grow=1.4 } = {}){
  const geo=new THREE.BufferGeometry(); const seed=new Float32Array(n*4);
  for(let i=0;i<n;i++){ seed[i*4]=hash(i+1); seed[i*4+1]=hash(i*3.7+2); seed[i*4+2]=hash(i*9.1+5); seed[i*4+3]=hash(i*1.3+11); }
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n*3),3)); geo.setAttribute('seed', new THREE.BufferAttribute(seed,4));
  const mat=new THREE.ShaderMaterial({ transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    uniforms:{ uT:{value:-1}, uMap:{value:sprite}, uLife:{value:life}, uSpread:{value:spread}, uSpeed:{value:speed}, uUp:{value:up}, uSize:{value:size}, uDur:{value:dur}, uTint:{value:new THREE.Vector3(...tint)}, uScale:{value:H/2}, uAlpha:{value:alpha}, uGrow:{value:grow} },
    vertexShader:`attribute vec4 seed; uniform float uT,uLife,uSpread,uSpeed,uUp,uSize,uDur,uScale,uAlpha,uGrow; varying float vA;
      void main(){ float born = seed.w*uDur; float a = uT - born; float k = clamp(a/uLife,0.,1.);

function update(t){

    // spin: slow, then the time remap ramps it up (aggressive) from 15 s
    const w0=.5, ang = w0*lt + (lt>15 ? Math.pow(lt-15,2.2)*.35 : 0);
    wheel.position.set(0,5,0); wheel.rotation.z = -ang; can.rotation.x = -ang;
    const g=p(lt,1.0,2.2,OUT); wheel.scale.setScalar(g); tire.material.emissiveIntensity = .85 + (lt>15? (lt-15)*.18 : 0);
    nodes.forEach((n,i)=>{ const a=-ang + i*Math.PI/2 + Math.PI/2; n.userData.set(p(lt,2+i*2,2.6+i*2)); n.scale.setScalar(.7); n.position.set(Math.cos(a)*3.0*g, 5+Math.sin(a)*3.3*g, .4); n.quaternion.copy(camera.quaternion); });
    const camZ = mix(25,22,p(lt,0,14,INOUT)) + p(lt,15,25,IN)*3; look(v3(Math.sin(lt*.08)*1.2, 5.2+Math.sin(lt*.1)*.4, camZ).add(d), v3(0,5,0), 38);
    // every lap fires a can out of the rim
    flyCans.forEach((c,k)=>{ const t0 = 6 + k*1.35 - (k>6? (k-6)*.5:0); const a=lt-t0; c.visible = a>0 && a<3; if(!c.visible) return; const dir = k%2? 1:-1;
      c.position.set(dir*(2.7 + a*2.4), 5 + 4*a - 4.9*a*a*.6, 1+a*1.5); c.rotation.set(a*5,a*3,a*7); });
    hud(eHead,.065,.06,1.05); eHead.userData.set(p(lt,.4,1.3));
    eChips.forEach((c,i)=>{ hud(c,.065,.80+i*.042,1.0); c.userData.set(p(lt,11+i*1.6,11.6+i*1.6)); });
    rimY.position.set(0,5,3); rimY.intensity = 20 + (lt>15?(lt-15)*6:0); post.uniforms.uCA.value = 1 + (lt>15? (lt-15)*.3 : 0);
    speedBg.visible=true; speedMat.uniforms.uVP.value.set(.5,.56); speedMat.uniforms.uT.value = (w0*lt + (lt>15 ? Math.pow(lt-15,2.2)*.35 : 0))*.12; speedMat.uniforms.uV.value=1; speedMat.uniforms.uO.value = p(lt,.6,1.8);
  }

  if(id==='F'){ // ---------- CAN TO SPACE
    const ascend = p(lt,0,13,bez(.5,0,.5,1)); const alt = 128100*ascend;
    SPACE.setRGB(mix(.043,.004,ascend), mix(.07,.006,ascend), mix(.33,.03,ascend)); scene.background = SPACE; scene.fog.density = mix(.012,0,ascend);
    can.position.set(0, 2 + lt*1.4, 0); can.rotation.y = lt*.3; can.scale.setScalar(.8);
    balloon.position.set(0, can.position.y + 5.2, 0); balloon.scale.setScalar(mix(.5,.9,ascend));
    tethers.forEach((l,i)=>{ const a=i*Math.PI/2+.6; setLine(l, v3(Math.cos(a)*.5, can.position.y+4.0, Math.sin(a)*.5), v3(Math.cos(a)*1.2*balloon.scale.x, balloon.position.y+.2, Math.sin(a)*1.2*balloon.scale.x)); });
    earth.position.set(0, can.position.y - 121.5 - mix(7,1.5,p(lt,0,8,INOUT)), -26); atmo.position.copy(earth.position); stars.material.opacity = p(lt,4,10); stars.position.y = can.position.y;
    // slow, buttery pull-out: tight on the can, ending wide with the curve of the Earth
    const z = mix(7,28,p(lt,0,13,INOUT)), y = can.position.y + mix(1.5,-1.0,ascend);
    look(v3(mix(1.5,-2,ascend), y, z).add(d), v3(0, can.position.y+mix(2,1,ascend), 0), mix(30,42,ascend));
    altT.userData.redraw(['ALTITUDE', Math.round(alt).toLocaleString('en-US')+' FT']); hud(altT,.065,.10,.78); altT.userData.set(p(lt,.5,1.2), 1-p(lt,13.4,14));
    hud(stackT,.065,.80,.8); stackT.userData.set(p(lt,9,9.8), 1-p(lt,13.4,14));
    hud(fDate,.065,.04,.9); fDate.userData.set(p(lt,.8,1.6), 1-p(lt,13.4,14));
    // 13.5 s: the world lights up with viewers
    const gk = p(lt,13.4,14.4,INOUT); globeG.visible = gk>0; globeG.position.set(camera.position.x*.0, can.position.y-.6, camera.position.z - 8); globeG.scale.setScalar(mix(.2,1.15,gk)); globeG.rotation.y = lt*.15;
    viewers.material.uniforms.uK.value = p(lt,14.2,19.5,OUT);
    if (gk>0){ can.visible = gk<.5; balloon.visible = gk<.5; tethers.forEach(l=>l.visible=gk<.5); look(v3(0, can.position.y, globeG.position.z+mix(8,8.5,gk)).add(d), v3(0, can.position.y-.3, globeG.position.z), 38); }
    else { balloon.visible=true; tethers.forEach(l=>l.visible=true); }
    const n = Math.round(8000000*p(lt,14.6,19.5,OUT)); liveT.userData.redraw(['● LIVE · YOUTUBE', n.toLocaleString('en-US')+(n>=8000000?'+':''), "PEAK CONCURRENT STREAMS · YOUTUBE'S FIGURE"]);
    hud(liveT,.065,.74,.92); liveT.userData.set(p(lt,14.4,15));
    key.intensity = 220; key.position.set(-8, can.position.y+10, 10); key.target.position.set(0,can.position.y+2,0); rimY.position.set(3, can.position.y+2, 3); rimY.intensity = 14; sun.visible = gk<.5 && lt>3; sun.material.opacity=1; sun.position.set(-9, can.position.y+9, -30); sun.quaternion.copy(camera.quaternion);
  }

  if(id==='G'){ // ---------- THE SCALE
    can.visible=false;
    const cards = lt<10; scaleG.visible = !cards; pans.forEach(o=>{ o.pg.visible=!cards; o.ls.forEach(l=>l.visible=!cards); });
    gCards.forEach((c,i)=>{ const a=[0,3.5,6.5][i], b=[3.5,6.5,10][i]; const on=lt>=a&&lt<b; const k=p(lt,a,a+.3); c.visible=on; if(on){ look(v3(0,4.5,mix(12,11.2,p(lt,a,b,OUT))).add(d), v3(0,4.5,0), 34); hud(c,.065,.30,.86+.03*p(lt,a,b,OUT),5); c.userData.set(1,k); } else c.userData.set(0,0); });
    if(cards){ look(camera.position.clone(), v3(0,4.5,0), 34); can.visible = lt<3.5; can.position.set(0,.3,0); can.rotation.y=lt*.4; can.scale.setScalar(.5); rimY.position.set(0,3,3); rimY.intensity=lt<3.5?20:0; }
    else {
      const lk=lt-10; const tilt = mix(.16, -.22, p(lk,2.6,4.2,bez(.3,1.6,.4,1))); // cost side heavy first, then exposure outweighs it
      beam.rotation.z = tilt; look(v3(mix(-.7,.7,p(lk,0,10,INOUT)),3.9,mix(15.8,14.6,p(lk,0,10,INOUT))).add(d), v3(0,2.7,0), 38);
      pans.forEach(o=>{ const ex = o.s*2.1; const px = Math.cos(tilt)*ex, py = 4.4 + Math.sin(tilt)*ex; o.pg.position.set(px, py-2.6, 0);
        o.ls.forEach((l,j)=>{ const a=j*2.094; setLine(l, v3(px,py,0), v3(px+Math.cos(a)*.88, py-2.6, Math.sin(a)*.88)); }); });
      eyes.forEach((e,i)=>{ const a=p(lk,1.2+i*.12,1.6+i*.12,OUT); e.visible=a>0; e.scale.setScalar(.7*a); });
      gLabels[0].userData.set(p(lk,.6,1.2)); gLabels[0].scale.setScalar(.62); face(gLabels[0], pans[0].pg.position.x, pans[0].pg.position.y-.75, 1.0); gLabels[0].scale.setScalar(.62);
      gLabels[1].userData.set(p(lk,1.8,2.4)); face(gLabels[1], pans[1].pg.position.x, pans[1].pg.position.y-.75, 1.0); gLabels[1].scale.setScalar(.62);
      hud(gSrc,.065,.90,.9); gSrc.userData.set(p(lk,3,3.6));
      rimY.position.set(3,4,3); rimY.intensity=16; rimR.position.set(-3,4,3); rimR.intensity=10;
    }
  }

  if(id==='H'){ // ---------- THE FALL: speed ramps, slow-mo, the logo moments
    floor.visible=false; scene.fog.density=.03;
    // time remap: fast fall → slow-mo hold (narrative) → fast again
    const v = lt<1.2 ? 1 : lt<8 ? .18 : lt<9 ? mix(.18,1.6,p(lt,8,9)) : 1.6;
    const fall = lt<1.2 ? lt*14 : lt<8 ? 16.8 + (lt-1.2)*14*.18 : lt<9 ? 34 + (lt-8)*14*.9 : 46.6 + (lt-9)*22;
    can.position.set(0, -fall, 0); can.rotation.set(fall*.08, fall*.05, fall*.06); can.scale.setScalar(.8);
    look(v3(1.2,-fall+1.2,9).add(d), v3(0,-fall+.2,0), 36);
    clouds.forEach((c,i)=>{ const o=(i*6.3+fall)%56; c.position.set((hash(i)-.5)*9, -fall-16+o, -3 - hash(i*3)*7); c.userData.set(2.2+hash(i)*.8); });
    const cp = p(lt,10.5,11.5,OUT)-p(lt,15.5,16.3); cliffPanel.visible=cp>0; cliffPanel.position.set(0,-fall-mix(-6,0,cp)*0+1.0,-4.5); cliffPanel.scale.setScalar(mix(.7,1,cp)); cliffPanel.material.opacity=1; cliffPanel.lookAt(camera.position);
    hud(hHead,.065,.08,1.2); hHead.userData.set(p(lt,1.4,2.2), 1-p(lt,9.6,10));
    hud(hSub,.065,.25,1.0); hSub.userData.set(p(lt,3.4,4.0), 1-p(lt,9.6,10));
    hLines.forEach((l,i)=>{ const a=[11.6,13.8,16.6][i]; hud(l,.065,[.66,.77,.84][i],1.05); l.userData.set(p(lt,a,a+.4), 1-p(lt,19.4,19.9)); });
    rimY.position.set(2,-fall+2,3); rimY.intensity=10; key.position.set(-6,-fall+12,8); key.target.position.set(0,-fall,0);
    speedBg.visible=true; speedMat.uniforms.uVP.value.set(.5,.2); speedMat.uniforms.uT.value = fall*.02; speedMat.uniforms.uV.value=1; speedMat.uniforms.uO.value=1;
  }

  if(id==='I'){ // ---------- THREE CANS
    can.visible=false;
    const steps=[1.8,8.3,15.0];
    trio.forEach((o,i)=>{ const pop=p(lt,steps[i],steps[i]+.15); setPop(o.c,pop); o.gas.userData.set(lt-steps[i]); o.c.rotation.y = Math.sin(lt*.5+i)*.25;
      const r=p(lt,steps[i]+.15,steps[i]+.9,OUT); o.scr.visible=r>0; o.scr.position.set(o.x, 3.25 + r*1.45, .1); o.scr.scale.setScalar((.3+.7*r)*.9); o.scr.rotation.y = -o.x*.08; o.scr.userData.light.intensity=7*r; });
    // camera trucks to each can as it pops, then pulls back to all three
    const focus = lt<8 ? -2.7 : lt<14.6 ? 0 : lt<21 ? 2.7 : 0; const fz = lt<21 ? 10.5 : mix(10.5,19,p(lt,21,24,INOUT));
    
    const tx = (()=>{ const segs=[[0,-2.7],[7.6,-2.7],[8.2,0],[14.3,0],[14.9,2.7],[21,2.7],[24,0]]; for(let j=0;j<segs.length-1;j++){ const [a,x0]=segs[j],[b,x1]=segs[j+1]; if(lt<b) return mix(x0,x1,p(lt,a,b,SNAP)); } return 0; })();
    look(v3(tx, 4.2, fz).add(d), v3(tx, 4.0, 0), 34);
    hud(iHead,.065,.06,1.05); iHead.userData.set(p(lt,.3,1.1));
    rimY.position.set(tx,5,3); rimY.intensity=14;
  }

  if(id==='J'){ // ---------- CRUSH → FOLLOW
    can.rotation.y = lt*.3; can.scale.setScalar(.72);
    const cr = p(lt,8.6,9.4,IN); crushU.value = cr; can.position.y = -.4;
    const flip = p(lt,9.4,10.2,SNAP); can.visible = flip < .5; btn.visible = flip >= .5; btn.position.set(0,2.6,0); btn.scale.setScalar(mix(.4,1,p(lt,9.8,10.4,OUT))); btn.rotation.y = (1-p(lt,9.8,10.4,OUT))*1.2;
    const tap = p(lt,14.3,14.4)-p(lt,14.4,14.7); btn.scale.multiplyScalar(1-.06*tap);
    const fol = lt>14.4; pill.material.color.set(fol?0x0b1253:YEL); pill.material.emissive.set(fol?0x1a2aa0:YEL); pill.material.emissiveIntensity=fol?.35:.3; btnT.visible=!fol; btnT2.visible=fol; btnT2.userData.set(1,1);
    jRing.position.set(0,2.6,0); jRing.userData.set(lt-14.4);
    look(v3(Math.sin(lt*.2)*.6, 3.6, mix(13,12,p(lt,0,20,INOUT))).add(d), v3(0,3.4,0), 34);
    hud(jHead,.065,.10,1.12); jHead.userData.set(p(lt,.3,1.4), 1-p(lt,8.2,8.6));
    hud(jFoot,.065,.12,1.05); jFoot.userData.set(p(lt,10.6,11.4));
    if(btnT.visible) btnT.userData.set(1,1); rimY.position.set(0,3,3); rimY.intensity = 10 + 30*crushU.value;
    if (lt > 19.97) { scene.visible=false; } // hard cut on the last frame
  }

  // impact frames
  let f=0, mode=0; for(const [a,n,m] of FLASH){ if(t>=a && t<a+n/30){ f=1; mode=m; } } post.uniforms.uFlash.value=f; post.uniforms.uMode.value=mode;
  post.uniforms.uT.value=t;
  // whip on every cut: a short ramp in, peak on the cut frame, a longer ramp out; direction alternates
  let wv=0, wd=1; SC.forEach((sc,i)=>{ if(i===0) return; const c=sc[1], k=t-c; if(k>-.2 && k<.3){ const v = k<0 ? Math.pow(1+k/.2,3) : Math.pow(1-k/.3,2); if(v>wv){ wv=v; wd = i%3===0 ? 0 : (i%2? 1 : -1); } } });
  post.uniforms.uWhip.value=wv; post.uniforms.uWDir.value=wd;
}

function frame(t){ scene.visible=true; update(t); renderer.setRenderTarget(rt); renderer.render(scene,camera); renderer.setRenderTarget(null); renderer.render(postScene,postCam); }
window.seek = t => { frame(Math.min(Math.max(t,0),DUR-1e-3)); };
window.DURATION = DUR;
window.ready = (async () => {
  await document.fonts.load(`900 64px Inter`); await document.fonts.load(`600 32px 'JetBrains Mono'`).catch(()=>{}); await document.fonts.ready;
  await new Promise(r=>{ if(BULL.complete) r(); else BULL.onload=r; });
  await Promise.all(Object.values(IMG).map(t => new Promise(r => { if (t.image && t.image.complete) r(); else { const i=setInterval(()=>{ if(t.image && t.image.complete){ clearInterval(i); r(); } },50); } })));
  // redraw every text and screen now that fonts and photos are loaded
  scene.traverse(o => { if (o.userData && o.userData.redraw && o.userData.set) { /* textMesh */ } });
  [hookT, [bHead,bCoke,bRB,cHead,cSub,drinkLab,dHead,dCost,dPrice,dX,eHead,altT,stackT,fDate,liveT,gSrc,hHead,hSub,iHead,jHead,jFoot,btnT,btnT2,oCostT,oPriceT], eChips, nodes, gCards, gLabels, hLines, floors.map(o=>o.lab)].flat().forEach(m => { const ln = m.material.uniforms.map.value.image; m.userData.redraw([]); });
  [...rbScreens, ...eyes, ...trio.map(o=>o.scr)].forEach(s=>s.userData.draw());
  LABEL.needsUpdate = true; const nl = labelTexture(); LABEL.image = nl.image; LABEL.needsUpdate = true;
  return true;
})();

/* ------------------------------------------------ preview player */
if (!window.RENDER) {
  const list=document.getElementById('list'); let cur=0, playing=false, last=0;
  SC.forEach(s=>{ const b=document.createElement('button'); b.innerHTML=`<b>${Math.floor(s[1]/60)}:${String(s[1]%60).padStart(2,'0')}</b>${s[3]}`; b.onclick=()=>{ cur=s[1]+.01; seek(cur); ui(); }; list.appendChild(b); });
  const sc=document.getElementById('scrub'), tc=document.getElementById('tc'), pl=document.getElementById('play');
  const ui=()=>{ sc.value=cur; tc.textContent=`${Math.floor(cur/60)}:${(cur%60).toFixed(1).padStart(4,'0')}`; };
  sc.oninput=e=>{ cur=+e.target.value; seek(cur); ui(); };
  pl.onclick=()=>{ playing=!playing; pl.textContent=playing?'Pause':'Play'; last=performance.now(); if(playing) requestAnimationFrame(tick); };
  function tick(now){ if(!playing) return; cur+=(now-last)/1000; last=now; if(cur>=DUR) cur=0; seek(cur); ui(); requestAnimationFrame(tick); }
  window.ready.then(()=>{ seek(2.9); cur=2.9; ui(); });
}
</script>
