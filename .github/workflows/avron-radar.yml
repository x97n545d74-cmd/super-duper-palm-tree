name: Avron Radar

# Every 30 minutes: reads the public feeds listed in avron-radar/config.json,
# adds new posts to the avron-radar-data branch, labels them with Claude and
# rebuilds dashboard.html there. Read-only: it never posts, likes or logs in.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: avron-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Open the data branch
        run: |
          git config user.name "avron-radar"
          git config user.email "avron-radar@users.noreply.github.com"
          if git ls-remote --exit-code origin avron-radar-data >/dev/null; then
            git fetch -q --depth 1 origin avron-radar-data
            git worktree add -q ../radar-data FETCH_HEAD
            git -C ../radar-data switch -q -c avron-radar-data
          else
            git worktree add -q --orphan -b avron-radar-data ../radar-data
          fi

      - name: Collect, label, build
        env:
          RADAR_DATA: ${{ github.workspace }}/../radar-data/data
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
        run: |
          python3 avron-radar/tools/probe.py; exit 0   # TEMP probe on the work branch only
          python3 avron-radar/radar.py run
          cp avron-radar/dashboard.html ../radar-data/dashboard.html

      - name: Save
        working-directory: ../radar-data
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -q -m "Radar $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M') IST"
            git push -q origin HEAD:avron-radar-data
          fi
