name: Avron Radar

# Keeps itself running, because GitHub's timer is unreliable on this repository:
# one run does a round every 30 minutes for about 5.5 hours, then starts the next
# run. The hourly timer below is only a backup that restarts the chain if it breaks.
#
# Each round reads the sources in avron-radar/config.json, keeps NSE's daily price
# file for every stock, has Claude label posts, copy results figures, read the
# important filings and write two briefs a day. Read-only: it never posts or logs in.
#   avron-radar-data       every post, filing read, price day and brief (history kept)
#   avron-radar-dashboard  only the latest dashboard.html and radar.db (no history)
# A run started by hand from another branch does one round, does not restart itself,
# and writes to the same branch names ending in -test.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      rounds:
        description: "Rounds to run (leave empty for the normal chain)"
        required: false
      interval:
        description: "Seconds between rounds (default 1800)"
        required: false
      question:
        description: "Ask the radar a question (answers appear in the dashboard's Ask tab)"
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: avron-radar-${{ github.ref }}-${{ inputs.question != '' && 'ask' || 'chain' }}
  cancel-in-progress: false

env:
  LIVE: ${{ github.ref_name == github.event.repository.default_branch }}

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Open the data branch
        run: |
          if [ "$LIVE" = "true" ]; then SUFFIX=""; else SUFFIX="-test"; fi
          echo "DATA_BRANCH=avron-radar-data$SUFFIX" >> "$GITHUB_ENV"
          echo "DASH_BRANCH=avron-radar-dashboard$SUFFIX" >> "$GITHUB_ENV"
          echo "PUBLIC_BRANCH=avron-radar-public$SUFFIX" >> "$GITHUB_ENV"
          BRANCH="avron-radar-data$SUFFIX"
          git config user.name "avron-radar"
          git config user.email "avron-radar@users.noreply.github.com"
          if git ls-remote --exit-code origin "$BRANCH" >/dev/null; then
            git fetch -q --depth 1 origin "$BRANCH"
            git worktree add -q ../radar-data FETCH_HEAD
            git -C ../radar-data switch -q -c "$BRANCH"
          else
            git worktree add -q --orphan -b "$BRANCH" ../radar-data
          fi

      - name: Open the X desk's branch
        run: |
          if [ "$LIVE" = "true" ]; then
            git fetch -q --depth 1 origin avron-x-merger
            git worktree add -q ../xmerger FETCH_HEAD
            git -C ../xmerger switch -q -c avron-x-merger
            echo "RADAR_X_FILE=$(cd ..; pwd)/xmerger/avron-x-merger/radar.jsonl" >> "$GITHUB_ENV"
          else
            echo "RADAR_X_FILE=$(cd ..; pwd)/radar-data/data/x_outbox_test.jsonl" >> "$GITHUB_ENV"   # tests never reach X
          fi

      - name: Rounds
        env:
          RADAR_DATA: ${{ github.workspace }}/../radar-data/data
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          ROUNDS: ${{ inputs.rounds }}
          INTERVAL: ${{ inputs.interval }}
          QUESTION: ${{ inputs.question }}
          GH_TOKEN: ${{ github.token }}
        run: |
          INTERVAL="${INTERVAL:-1800}"
          if [ -n "$QUESTION" ]; then ROUNDS=1; fi      # a question is answered once, without collecting
          if [ -z "$ROUNDS" ]; then
            if [ "$LIVE" = "true" ]; then ROUNDS=11; else ROUNDS=1; fi     # 11 rounds x 30 minutes = 5.5 hours
          fi
          round=0
          while [ "$round" -lt "$ROUNDS" ]; do
            round=$((round + 1))
            start=$(date +%s)
            echo "::group::Round $round of $ROUNDS at $(TZ=Asia/Kolkata date '+%H:%M') IST"

            if [ "$LIVE" = "true" ] && [ "$round" -gt 1 ]; then      # pick up merged code and config changes
              git fetch -q origin "$GITHUB_REF_NAME" && git checkout -q FETCH_HEAD || echo "code update failed this round"
            fi

            if [ "$LIVE" = "true" ]; then
              git -C ../xmerger pull -q --rebase origin avron-x-merger || echo "X desk pull failed this round"
            fi
            if [ -n "$QUESTION" ]; then
              python3 avron-radar/radar.py ask "$QUESTION" || echo "the question failed"
            else
              python3 avron-radar/radar.py run || echo "radar failed this round"
            fi

            (
              cd ../radar-data
              git rm -q --cached --ignore-unmatch dashboard.html && rm -f dashboard.html
              git add -A
              if ! git diff --cached --quiet; then
                git commit -q -m "Radar $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M') IST"
                # a question answered meanwhile may have pushed first: take its commit, then push
                git pull -q --rebase origin "$DATA_BRANCH" 2>/dev/null || git rebase --abort 2>/dev/null || true
                git push -q origin "HEAD:$DATA_BRANCH" || echo "data push failed this round"
              fi
            )

            if [ "$LIVE" = "true" ] && [ -f ../xmerger/avron-x-merger/radar.jsonl ]; then
              (
                cd ../xmerger
                git add avron-x-merger/radar.jsonl
                if ! git diff --cached --quiet; then
                  git commit -q -m "Radar: items for the X desk $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M') IST"
                  for try in 1 2 3; do
                    git pull -q --rebase origin avron-x-merger && git push -q origin HEAD:avron-x-merger && break
                    sleep 10
                  done || echo "X desk push failed this round"
                fi
              )
            fi

            if [ -f avron-radar/dashboard.html ]; then
              git worktree remove --force ../dash 2>/dev/null || true
              git branch -q -D dashboard-build 2>/dev/null || true
              git worktree add -q --orphan -b dashboard-build ../dash
              cp avron-radar/dashboard.html avron-radar/radar.db ../dash/
              (
                cd ../dash
                git add -A
                git commit -q -m "Dashboard $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M') IST"
                git push -q --force origin "HEAD:$DASH_BRANCH" || echo "dashboard push failed this round"
              )
            fi
            if [ -f avron-radar/avron-feed.json ] && [ -z "$QUESTION" ]; then      # the website's feed and widget
              git worktree remove --force ../pub 2>/dev/null || true
              git branch -q -D public-build 2>/dev/null || true
              git worktree add -q --orphan -b public-build ../pub
              cp avron-radar/avron-feed.json avron-radar/public/avron-widget.js avron-radar/public/embed-example.html ../pub/
              (
                cd ../pub
                git add -A
                git commit -q -m "Public feed $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M') IST"
                git push -q --force origin "HEAD:$PUBLIC_BRANCH" || echo "public feed push failed this round"
              )
            fi
            if [ "$LIVE" = "true" ] && [ -z "$QUESTION" ]; then      # watchdog: is the live news lane alive?
              if git fetch -q --depth 1 origin avron-radar-live 2>/dev/null; then
                age=$(( $(date +%s) - $(git log -1 --format=%ct FETCH_HEAD) ))
              else
                age=999999
              fi
              hour=$(TZ=Asia/Kolkata date +%-H)
              if { [ "$hour" -ge 6 ] && [ "$age" -gt 1200 ]; } || [ "$age" -gt 2700 ]; then
                echo "live lane silent for ${age}s: restarting it"
                gh workflow run avron-live.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" || true
              fi
            fi
            echo "::endgroup::"

            if [ "$round" -lt "$ROUNDS" ]; then
              wait=$(( start + INTERVAL - $(date +%s) ))
              if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
            fi
          done

      - name: Start the next run
        if: always() && github.ref_name == github.event.repository.default_branch && inputs.rounds == '' && inputs.question == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run avron-radar.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
