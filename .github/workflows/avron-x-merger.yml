name: Avron X merger writer

# Every 5 minutes, 7 AM to midnight India time (01:30 to 18:30 UTC).
# The script skips runs before 7 AM IST. It asks Claude to read new NSE
# filings and appends headlines to avron-x-merger/queue.jsonl on the
# avron-x-merger branch. It never posts to X.
on:
  schedule:
    - cron: "*/5 1-17 * * *"
    - cron: "0-25/5 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: avron-x-merger-writer
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: avron-x-merger
          sparse-checkout: avron-x-merger

      - name: Ask Claude for new headlines
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 avron-x-merger/writer.py

      - name: Save new headlines
        run: |
          if git diff --quiet -- avron-x-merger/queue.jsonl; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "avron-x-merger"
          git config user.email "avron-x-merger@users.noreply.github.com"
          git add avron-x-merger/queue.jsonl
          git commit -m "Headlines $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M') IST"
          git pull --rebase origin avron-x-merger
          git push origin HEAD:avron-x-merger
