name: Avron Live

# The website's live news lane. One run does a round every 3 minutes from 6 AM to midnight India time
# (every 15 minutes overnight) for about 5.5 hours, then starts the next run, so it is always on.
# Each round reads the news feeds, NSE's announcements and the X desk's posts (avron-radar/live.py, no
# model, no cost) and publishes live.json to the avron-radar-live branch, where any website can read it,
# and, when the PRIVATE_DATA_TOKEN secret exists, to the private repository for the personal dashboard.
# It also checks the main Avron Radar chain and restarts it if it has stopped, and the main chain does
# the same for this one. The hourly timer is only a backup.
# A run started by hand from another branch does the rounds asked for (default 1) and writes to
# avron-radar-live-test.
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      rounds:
        description: "Rounds to run (leave empty for the normal chain)"
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: avron-live-${{ github.ref }}
  cancel-in-progress: false

env:
  LIVE: ${{ github.ref_name == github.event.repository.default_branch }}

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Rounds
        env:
          ROUNDS: ${{ inputs.rounds }}
          GH_TOKEN: ${{ github.token }}
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: |
          git config user.name "avron-live"
          git config user.email "avron-live@users.noreply.github.com"
          if [ "$LIVE" = "true" ]; then BRANCH=avron-radar-live; MAX=${ROUNDS:-0}; else BRANCH=avron-radar-live-test; MAX=${ROUNDS:-1}; fi
          mkdir -p ../live-state
          if git fetch -q --depth 1 origin "$BRANCH" 2>/dev/null; then git show FETCH_HEAD:live.json > ../live-state/live.json || true; fi
          PRIVATE_OK=""
          if [ -n "$PRIVATE_DATA_TOKEN" ] && python3 avron-radar/private.py check; then PRIVATE_OK=1; fi   # the personal dashboard's copy
          end=$(( $(date +%s) + 19800 ))      # 5 hours 30 minutes
          round=0
          while [ "$(date +%s)" -lt "$end" ]; do
            round=$((round + 1))
            start=$(date +%s)
            if [ "$LIVE" = "true" ] && [ $((round % 10)) -eq 1 ] && [ "$round" -gt 1 ]; then      # pick up merged changes
              git fetch -q origin "$GITHUB_REF_NAME" && git checkout -q FETCH_HEAD || echo "code update failed this round"
            fi
            python3 avron-radar/live.py ../live-state || echo "live round failed"

            if [ -f ../live-state/live.json ]; then
              git worktree remove --force ../live-pub 2>/dev/null || true
              git branch -q -D live-build 2>/dev/null || true
              git worktree add -q --orphan -b live-build ../live-pub
              cp ../live-state/live.json ../live-pub/
              ( cd ../live-pub && git add -A && git commit -q -m "Live $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M') IST" \
                && git push -q --force origin "HEAD:$BRANCH" ) || echo "live push failed this round"
              if [ -n "$PRIVATE_OK" ]; then python3 avron-radar/private.py push ../live-state/live.json || true; fi
            fi

            if [ "$LIVE" = "true" ] && [ $((round % 10)) -eq 0 ]; then      # watchdog: is the main radar chain alive?
              if git fetch -q --depth 1 origin avron-radar-dashboard 2>/dev/null; then
                age=$(( $(date +%s) - $(git log -1 --format=%ct FETCH_HEAD) ))
                if [ "$age" -gt 5400 ]; then
                  echo "main radar silent for ${age}s: restarting it"
                  gh workflow run avron-radar.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" || true
                fi
              fi
            fi

            if [ "$MAX" -gt 0 ] && [ "$round" -ge "$MAX" ]; then break; fi
            hour=$(TZ=Asia/Kolkata date +%-H)
            if [ "$hour" -ge 6 ]; then gap=180; else gap=900; fi
            wait=$(( start + gap - $(date +%s) ))
            if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          done

      - name: Start the next run
        if: always() && github.ref_name == github.event.repository.default_branch && inputs.rounds == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run avron-live.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
